name: Keepalive

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update keepalive timestamp
        run: |
          echo "# Keepalive" > KEEP_ALIVE.md
          echo "" >> KEEP_ALIVE.md
          echo "Last activity: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> KEEP_ALIVE.md
          echo "" >> KEEP_ALIVE.md
          echo "This file is updated weekly by the keepalive workflow so GitHub does not disable scheduled workflows due to inactivity." >> KEEP_ALIVE.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add KEEP_ALIVE.md
          git diff --staged --quiet || git commit -m "chore: weekly keepalive $(date -u +'%Y-%m-%d')"
          git push
